name: Build and deploy Astro site via FTP

on:
  push:
    branches:
      - main
      - test
      - relaunch-astro

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Alles außer main ist Testumgebung: läuft unter /test/ und wird von Suchmaschinen ausgeschlossen
      - name: Build site
        run: npm run build
        env:
          SITE_BASE: ${{ github.ref == 'refs/heads/main' && '/' || '/test' }}
          PUBLIC_NOINDEX: ${{ github.ref == 'refs/heads/main' && 'false' || 'true' }}

      - name: Deploy to production (main)
        if: github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_MAIN_DIR }}

      - name: Deploy to test (test, relaunch-astro)
        if: github.ref != 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_TEST_DIR }}
