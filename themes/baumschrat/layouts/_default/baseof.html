<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="{{ "favicon.png" | relURL }}" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ block "title" . }}{{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ block "description" . }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/theme.css" | relURL }}" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: {
              50:  'var(--color-emerald-50)',
              100: 'var(--color-emerald-100)',
              200: 'var(--color-emerald-200)',
              400: 'var(--color-emerald-400)',
              500: 'var(--color-emerald-500)',
              700: 'var(--color-emerald-700)',
              800: 'var(--color-emerald-800)',
              900: 'var(--color-emerald-900)',
            }
          }
        }
      }
    }
  </script>
  {{ block "head" . }}{{ end }}
</head>
<body class="min-h-screen bg-white">
  {{ block "main" . }}{{ end }}

  <div id="dsgvo-legal-bar">
    &copy; 2026 {{ .Site.Params.copyright_name }} |
    <a href="{{ .Site.Params.wko_url }}" target="_blank" rel="noopener noreferrer">Impressum (WKO)</a> |
    <a href="{{ "datenschutz/" | relURL }}">Datenschutz</a>
  </div>
</body>
</html>
